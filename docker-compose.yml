version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: phantix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phantix_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-phantix_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-phantix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Unified Production Phantix Service (One-URL Single Container: FastAPI + React SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
    container_name: phantix_production_app
    restart: unless-stopped
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-phantix_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-phantix_db}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-fake-social-media-detect-4bf0a}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-replace_with_secure_random_secret}
      - ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
