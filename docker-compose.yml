version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: identitytrace_db
    environment:
      POSTGRES_USER: identitytrace
      POSTGRES_PASSWORD: identitytrace_secure_password_2026
      POSTGRES_DB: identitytrace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identitytrace -d identitytrace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: identitytrace_backend
    environment:
      - DATABASE_URL=postgresql://identitytrace:identitytrace_secure_password_2026@postgres:5432/identitytrace_db
      - FIREBASE_PROJECT_ID=identitytrace-prod
      - ALLOWED_ORIGINS=http://localhost,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: identitytrace_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
