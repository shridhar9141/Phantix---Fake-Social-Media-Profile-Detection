services:
  # Unified Docker Web Service (Full-Stack React SPA + FastAPI Backend on One URL)
  - type: web
    name: phantix-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FIREBASE_PROJECT_ID
        value: fake-social-media-detect-4bf0a
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false

